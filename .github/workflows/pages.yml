name: Deploy coming-soon page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pages serves static files only. Keep the homepage and drop every route
      # that needs a server. This happens in the CI checkout, not in the repo.
      - name: Keep only the coming-soon page
        run: |
          find src/app -mindepth 1 -maxdepth 1 \
            ! -name page.tsx ! -name layout.tsx ! -name globals.css ! -name icon.svg \
            -exec rm -rf {} +
          rm -f src/middleware.ts

      - run: npm run build
        env:
          NEXT_PUBLIC_STATIC_SITE: "1"

      # The site is served from /app on github.io and from / on the custom
      # domain. Root-absolute /_next and /brand URLs miss in one of those.
      - run: node scripts/relativize-pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
